name: Update organization contributions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-metrics.yml
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  contributions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render public organization contributions
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ github.token }}
          committer_token: ${{ github.token }}
          user: Luo1imasi
          filename: assets/organization-contributions.svg
          template: classic
          base: ''
          base_skip: yes
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull_request, issue
          plugin_notable_indepth: no
          config_animations: no
          config_timezone: Asia/Shanghai
          config_padding: 0, 8
          output_condition: data-changed
          committer_message: 'chore: update organization contributions [skip ci]'
          plugins_errors_fatal: yes
          notice_releases: no
          retries: 2
          retries_delay: 10
          retries_output_action: 2
          retries_delay_output_action: 5
